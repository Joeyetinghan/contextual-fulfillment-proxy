name: fulfillment_proxy
channels:
  - pytorch
  - nvidia
  - gurobi
  - conda-forge
dependencies:
  # Runtime
  - python=3.12
  - pip

  # Core numerical/data stack
  - numpy>=2.0,<2.4
  - pandas>=2.2,<2.4
  - scipy>=1.13,<1.16
  - pyarrow>=15,<22
  - tqdm
  - joblib

  # Deep learning. For CPU-only installs, replace pytorch-cuda with cpuonly.
  - pytorch=2.4.*
  - pytorch-cuda=12.4

  # Forecasting, proxy training, and evaluation
  - scikit-learn>=1.5,<1.8
  - xgboost>=2,<3
  - quantile-forest>=1.3,<1.5
  - optuna>=4,<5
  - catboost>=1.2,<1.3
  - matplotlib-base>=3.8,<3.11

  # Optimization. A valid Gurobi license is still required at runtime.
  - gurobi>=11,<14

  # Carrier-service augmentation / coordinate utilities
  - pgeocode>=0.5,<1
  - cartopy>=0.23,<0.26
  - shapely>=2,<2.2
